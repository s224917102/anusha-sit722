name: Deploy to staging

on:
  # Manual trigger
  workflow_dispatch:


  workflow_run:
    workflows: ["Testing, building and push image to ACR"]
    types:
      - completed

env:
  RG_STAGING: anusha-rg-stg
  AKS_STAGING: anusha-aks-stg
  NS: staging

jobs:
  # Job 1: Create Staging Infrastructure
  create_and_deploy_backend_to_staging:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    outputs:
      PRODUCT_API_IP: ${{ steps.get_product_ip.outputs.external_ip }}
      CUSTOMER_API_IP: ${{ steps.get_customer_ip.outputs.external_ip }}
      ORDER_API_IP: ${{ steps.get_order_ip.outputs.external_ip }}
      FRONTEND_IP: ${{ steps.get_frontend_ip.outputs.external_ip }}
    env:
      RG_STAGING: env.RG_STAGING
      AKS_STAGING: env.AKS_STAGING
      NS: env.NS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure 
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Login to Azure Container Registry (ACR)
      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

      - name: Get AKS credentials
        run: |
          set -euo pipefail
          az aks get-credentials --resource-group "$RG_STAGING" --name "RG_STAGING" --overwrite-existing

      - name: Create namespace & set context
        run: |
          set -euo pipefail
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl config set-context --current --namespace="$NS"
          CURRENT_CONTEXT=$(kubectl config current-context)
          echo "Current context: $CURRENT_CONTEXT"

      - name: Apply backend config & databases
        run: |
          set -euo pipefail
          kubectl apply -n "$NS" -f k8s/configmaps.yaml
          kubectl apply -n "$NS" -f k8s/secrets.yaml
          kubectl apply -n "$NS" -f k8s/product-db.yaml
          kubectl apply -n "$NS" -f k8s/order-db.yaml

      - name: Deploy Product & Order services
        run: |
          set -euo pipefail
          kubectl apply -n "$NS" -f k8s/product-service.yaml
          kubectl apply -n "$NS" -f k8s/order-service.yaml
          kubectl get all -n "$NS"

      - name: Deploy Backend Infrastructure (Namespace, ConfigMaps, Secrets, Databases)
        run: |
          set -euo pipefail
          echo "Deploying backend infrastructure..."
          cd k8s/
          kubectl apply -n "$NS" -f configmaps.yaml
          kubectl apply -n "$NS" -f secrets.yaml
          kubectl apply -n "$NS" -f product-db.yaml
          kubectl apply -n "$NS" -f customer-db.yaml
          kubectl apply -n "$NS" -f order-db.yaml

      - name: Deploy Backend Microservices (Product, Customer, Order)
        run: |
          set -euo pipefail
          echo "Deploying backend microservices..."
          cd k8s/
          kubectl apply -n "$NS" -f product-service.yaml
          kubectl apply -n "$NS" -f customer-service.yaml
          kubectl apply -n "$NS" -f order-service.yaml
      
      - name: Wait for Backend LoadBalancer IPs
        env:
          PRODUCT_SERVICE_NAME:  "product-service-w10-aks"
          CUSTOMER_SERVICE_NAME: "customer-service-w10-aks"
          ORDER_SERVICE_NAME: "order-service-w10-aks"

        run: |
          set -euo pipefail
          echo "Waiting for Product, Customer, Order LoadBalancer IPs to be assigned (up to 5 minutes)..."
          PRODUCT_IP=""
          CUSTOMER_IP=""
          ORDER_IP=""
          
          for i in $(seq 1 60); do
            echo "Attempt $i/60 to get IPs..."
            PRODUCT_IP=$(kubectl get service "$PRODUCT_SERVICE_NAME" -n "$NS" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            CUSTOMER_IP=$(kubectl get service "$CUSTOMER_SERVICE_NAME" -n "$NS" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            ORDER_IP=$(kubectl get service "$ORDER_SERVICE_NAME" -n "$NS" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [[ -n "$PRODUCT_IP" && -n "$CUSTOMER_IP" && -n "$ORDER_IP" ]]; then
              echo "All backend LoadBalancer IPs assigned!"
              echo "Product Service IP: $PRODUCT_IP"
              echo "Customer Service IP: $CUSTOMER_IP"
              echo "Order Service IP: $ORDER_IP"
              break
            fi
            sleep 5 # Wait 5 seconds before next attempt
          done
          
          if [[ -z "$PRODUCT_IP"|| -z "$CUSTOMER_IP" || -z "$ORDER_IP" ]]; then
            echo "Error: One or more LoadBalancer IPs not assigned after timeout."
            exit 1 # Fail the job if IPs are not obtained
          fi
          
          # These are environment variables for subsequent steps in the *same job*
          # And used to set the job outputs
          echo "PRODUCT_IP=$PRODUCT_IP" >> $GITHUB_ENV
          echo "CUSTOMER_IP=$CUSTOMER_IP" >> $GITHUB_ENV
          echo "ORDER_IP=$ORDER_IP" >> $GITHUB_ENV

          echo " Deployed to staging environment successfully!"

      - name: Capture Product Service IP for Workflow Output
        id: get_product_ip
        run: echo "external_ip=${{ env.PRODUCT_IP }}" >> $GITHUB_OUTPUT
      
      - name: Capture Customer Service IP for Workflow Output
        id: get_customer_ip
        run: echo "external_ip=${{ env.CUSTOMER_IP }}" >> $GITHUB_OUTPUT

      - name: Capture Order Service IP for Workflow Output
        id: get_order_ip
        run: echo "external_ip=${{ env.ORDER_IP }}" >> $GITHUB_OUTPUT

      - name: Logout from Azure
        run: az logout

  # Job 3: Run Staging Tests
  backend_test_staging:
    runs-on: ubuntu-latest
    needs: create_and_deploy_backend_to_staging
    if: ${{ needs.create_and_deploy_backend_to_staging.result == 'success' }}

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Acceptance Tests
        run: |
          echo " Run acceptance test for backend services"
          
          PRODUCT_IP=${{ needs.create_and_deploy_backend_to_staging.outputs.PRODUCT_API_IP }}
          ORDER_IP=${{ needs.create_and_deploy_backend_to_staging.outputs.ORDER_API_IP }}

          # Check for product service api endpoints
          echo " Check for product service api endpoint"  
          curl -f -v -s "http://$PRODUCT_IP:8000" || exit 1
          
          # Check for order service api endpoints
          echo " Check for order service api endpoint"  
          curl -f -v -s "http://$ORDER_IP:8001" || exit 1

          # Check for customer service api endpoints
          echo "  Check for customer service api endpoint "  
          curl -f -v -s "http://$CUSTOMER_IP:8002" || exit 1

          echo " Acceptance tests are all passed for backend services"
 
      - name: Logout from Azure
        run: az logout
        if: always()

  # Job 1: Create Staging Infrastructure
  frontend_deploy_staging:
    runs-on: ubuntu-latest
    needs: [create_and_deploy_backend_to_staging, backend_test_staging]
    if: ${{ needs.backend_test_staging.result == 'success' }}

    outputs:
      FRONTEND_IP: ${{ steps.get_frontend_ip.outputs.external_ip }}
    env:
      NS: env.NS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure 
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Inject Backend IPs into Frontend main.js
        run: |
          echo "Injecting IPs into frontend/static/js/main.js"

          PRODUCT_IP=${{ needs.create_and_deploy_backend_to_staging.outputs.PRODUCT_API_IP }}
          ORDER_IP=${{ needs.create_and_deploy_backend_to_staging.outputs.ORDER_API_IP }}
          CUSTOMER_IP=${{ needs.create_and_deploy_backend_to_staging.outputs.CUSTOMER_API_IP }}

          # Ensure frontend/main.js is directly in the path for sed
          sed -i "s|_PRODUCT_API_URL_|http://$PRODUCT_IP:8000|g" frontend/main.js
          sed -i "s|_ORDER_API_URL_|http://$ORDER_IP:8001|g" frontend/main.js
          sed -i "s|_CUSTOMER_API_URL_|http://$CUSTOMER_IP:8002|g" frontend/main.js
          
          # Display the modified file content for debugging
          echo "--- Modified main.js content ---"
          cat frontend/main.js
          echo "---------------------------------"

      - name: Deploy Frontend to AKS
        run: |
          set -euo pipefail

          echo "Deploying frontend to AKS cluster.."
          
          cd k8s/

          # Ensure frontend-service.yaml is configured with your ACR
          kubectl apply -n "$NS" -f frontend.yaml
      
      - name: Wait for Frontend LoadBalancer IPs
        env:
          FRONTEND_SERVICE_NAME: "frontend-w10-aks"
        run: |
          set -euo pipefail
          echo "Waiting for Frontend LoadBalancer IPs to be assigned (up to 5 minutes)..."
          FRONTEND_IP=""
          
          for i in $(seq 1 60); do
            echo "Attempt $i/60 to get IP..."
            FRONTEND_IP=$(kubectl get service "$FRONTEND_SERVICE_NAME" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [[ -n "$FRONTEND_IP" ]]; then
              echo "Frontend LoadBalancer IPs assigned: $FRONTEND_IP"
              break
            fi
            sleep 5 # Wait 5 seconds before next attempt
          done
          
          if [[ -z "$FRONTEND_IP" ]]; then
            echo "Error: One or more LoadBalancer IPs not assigned after timeout."
            exit 1 # Fail the job if IP is not obtained
          fi
          
          # These are environment variables for subsequent steps in the *same job*
          # And used to set the job outputs
          echo "FRONTEND_IP=$FRONTEND_IP" >> $GITHUB_ENV

      - name: Capture Frontend Service IP for Workflow Output
        id: get_frontend_ip
        run: echo "external_ip=${{ env.FRONTEND_IP }}" >> $GITHUB_OUTPUT

      - name: Logout from Azure
        run: az logout

    # Job 3: Run Staging Tests for frontend
  frontend_test_staging:
    runs-on: ubuntu-latest
    needs: frontend_deploy_staging
    if: ${{ needs.frontend_deploy_staging.result == 'success' }}

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Acceptance Tests For Frontend
        run: |
          echo " Run acceptance test for frontend"
          
          FRONTEND_IP=${{needs.frontend_deploy_staging.outputs.FRONTEND_API_IP }}

          # Check for frontend service api endpoints
          echo "  Testing frontend endpoints"  
          curl -f -v -s "http://$FRONTEND_IP:80" || exit 1

          echo " Acceptance tests passed for frontend"
 
      - name: Logout from Azure
        run: az logout
        if: always()

  # Job 5: Destroy Staging Environment
  destroy_staging_environment:
    runs-on: ubuntu-latest
    needs: [create_and_deploy_backend_to_staging, frontend_deploy_staging]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete Backend Infrastructure (Namespace, ConfigMaps, Secrets, Databases)
        run: |
          echo "Deleting backend infrastructure..."
          cd k8s/
          kubectl delete -n "$NS" -f configmaps.yaml
          kubectl delete -n "$NS" -f secrets.yaml
          kubectl delete -n "$NS" -f product-db.yaml
          kubectl delete -n "$NS" -f order-db.yaml
          kubectl delete -n "$NS" -f customer-db.yaml
      
      - name: Delete Backend Microservices (Product, Order, Customer)
        run: |
          echo "Deleting backend microservices..."
          cd k8s/
          kubectl delete -n "$NS" -f product-service.yaml
          kubectl delete -n "$NS" -f order-service.yaml
          kubectl delete -n "$NS" -f customer-service.yaml
        
      - name: Delete Frontend Microservices
        run: |
          echo "Deleting frontend microservices"
          cd k8s/
          kubectl delete -n "$NS" -f frontend.yaml

      - name: Logout from Azure
        run: az logout
        if: always()