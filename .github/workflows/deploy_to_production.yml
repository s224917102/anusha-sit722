name: Production Deploy (on main)

on:
  pull_request:
    branches: [ main ]
    types: [closed]

  env:
    RG_PRODUCTION: "anusha-rg-production"
    AKS_PRODUCTION: "anusha-aks-production"   

jobs:
  deploy-production:
    if: github.event.pull_request.merged == true
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Azure credentials
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          set -euo pipefail
          az aks get-credentials --resource-group "${{ env.RG_PRODUCTION }}" --name "${{ env.AKS_PRODUCTION }}" --overwrite-existing

      - name: Create staging namespace
        run: kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Production Application
        run: |
          echo " Deploying to production environment..."
          kubectl apply -f k8s/
          echo " Waiting for services to initialize..."
          sleep 120

      - name: Check deployment status
        run: |
          echo "Current status:"
          kubectl get pods
          kubectl get services
          echo "Production deployment completed successfully!"

      - name: Get application URLs
        run: |
          echo "Your application URLs:"
          kubectl get service frontend-w10-aks
          kubectl get service product-service-w10-aks
          echo "Note: It may take 2-5 minutes for LoadBalancer IPs to be assigned"