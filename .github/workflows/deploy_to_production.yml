name: Production Deploy (on main)

# Trigger the workflow on a pull request on main branch
on:
  push:
    branches: [main]
  
  pull_request:
    branches: [ main ]
  env:
    RG_PRODUCTION: "anusha-rg-production"
    AKS_PRODUCTION: "anusha-aks-production"     
jobs:
  # Job 1: Deploy to Production
 #  Deploy to production
  deploy_to_production:
    runs-on: ubuntu-latest
    env:
      NS: "production"
    
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Azure 
          uses: azure/login@v1
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}

        - name: Display Trigger Information
          run: |
            echo "production Resource Group: ${{ env.RG_PRODUCTION }}"
            echo "production AKS Cluster: ${{ env.AKS_PRODUCTION }}"

        - name: Get AKS credentials
          run: |
            set -euo pipefail
            az aks get-credentials --resource-group "${{ env.RG_PRODUCTION }}" --name "${{ env.AKS_PRODUCTION }}" --overwrite-existing

        - name: Create namespace & set context
          run: |
            set -euo pipefail
            kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
            
            kubectl config set-context --current --namespace="$NS"
            CURRENT_CONTEXT=$(kubectl config current-context)
            echo "Current context: $CURRENT_CONTEXT"

        - name: Apply backend config & databases
          run: |
            set -euo pipefail
            kubectl apply -n "$NS" -f k8s/configmaps.yaml
            kubectl apply -n "$NS" -f k8s/secrets.yaml
            kubectl apply -n "$NS" -f k8s/product-db.yaml
            kubectl apply -n "$NS" -f k8s/order-db.yaml

        - name: Deploy Product & Order services
          run: |
            set -euo pipefail
            kubectl apply -n "$NS" -f k8s/product-service.yaml
            kubectl apply -n "$NS" -f k8s/order-service.yaml
            kubectl get all -n "$NS"

        - name: Deploy Backend Infrastructure (Namespace, ConfigMaps, Secrets, Databases)
          run: |
            set -euo pipefail
            echo "Deploying backend infrastructure..."
            cd k8s/
            kubectl apply -n "$NS" -f configmaps.yaml
            kubectl apply -n "$NS" -f secrets.yaml
            kubectl apply -n "$NS" -f product-db.yaml
            kubectl apply -n "$NS" -f customer-db.yaml
            kubectl apply -n "$NS" -f order-db.yaml

        - name: Deploy Backend Microservices (Product, Customer, Order)
          run: |
            set -euo pipefail
            echo "Deploying backend microservices..."
            cd k8s/
            kubectl apply -n "$NS" -f product-service.yaml
            kubectl apply -n "$NS" -f customer-service.yaml
            kubectl apply -n "$NS" -f order-service.yaml
        
        - name: Wait for Application Services to be Ready 
          run: |
            echo " Waiting for application services to be ready..."
            kubectl wait --for=condition=available --timeout=60s deployment/product-service-w10-aks -n production
            kubectl wait --for=condition=available --timeout=60s deployment/order-service-w10-aks -n production
            kubectl wait --for=condition=available --timeout=60s deployment/customer-service-w10-aks -n production
            echo " Application services are ready!"

        - name: Get production Environment URLs
          run: |
            echo " Retrieving production environment URLs..."
            kubectl get services -n production
            
            # Wait for external IPs with timeout
            echo " Waiting for LoadBalancer external IPs..."
            timeout 10 bash -c '
            while [[ $(kubectl get svc "$PRODUCT_SERVICE_NAME" -n production -o jsonpath="{.status.loadBalancer.ingress[0].ip}" 2>/dev/null) == "" ]]; do
              echo "Waiting for "$PRODUCT_SERVICE_NAME" external IP..."
              sleep 15
            done
            while [[ $(kubectl get svc "$ORDER_SERVICE_NAME" -n production -o jsonpath="{.status.loadBalancer.ingress[0].ip}" 2>/dev/null) == "" ]]; do
              echo "Waiting for "$ORDER_SERVICE_NAME" external IP..."
              sleep 15
            done
            while [[ $(kubectl get svc "$CUSTOMER_SERVICE_NAME" -n production -o jsonpath="{.status.loadBalancer.ingress[0].ip}" 2>/dev/null) == "" ]]; do
              echo "Waiting for "$CUSTOMER_SERVICE_NAME" external IP..."
              sleep 15
            done
            ' || echo "  LoadBalancer IPs may take additional time to provision"

            echo "Injecting IPs into frontend/static/js/main.js"

            PRODUCT_IP=$(kubectl get svc "$PRODUCT_SERVICE_NAME" -n production -o jsonpath="{.status.loadBalancer.ingress[0].ip}")
            ORDER_IP=$(kubectl get svc "$CUSTOMER_SERVICE_NAME" -n production -o jsonpath="{.status.loadBalancer.ingress[0].ip}")
            CUSTOMER_IP=$(kubectl get svc "$ORDER_SERVICE_NAME" -n production -o jsonpath="{.status.loadBalancer.ingress[0].ip}") 

            # Test Product Service API endpoints
            echo "Testing Product Service APIs..."
            
            # Get products (should return empty list initially)
            echo "  - Testing GET /products"
            curl -f -v -s "http://$PRODUCT_IP:8000/products" || exit 1
            
            # Test Order Service API endpoints
            echo "Testing Order Service APIs..."
            
            # Get orders (should return empty list initially)
            echo "  - Testing GET /orders"  
            curl -f -v -s "http://$ORDER_IP:8001/orders" || exit 1

            # Test Customer Service API endpoints
            echo "Testing Customer Service APIs..." 

            # Get customers (should return empty list initially)
            echo "  - Testing GET /customers"  
            curl -f -v -s "http://$CUSTOMER_IP:8002/customers" || exit 1
            
            echo " All acceptance tests passed!"

            # Ensure frontend/main.js is directly in the path for sed
            sed -i "s|_PRODUCT_API_URL_|http://$PRODUCT_IP:8000|g" frontend/main.js
            sed -i "s|_ORDER_API_URL_|http://$ORDER_IP:8001|g" frontend/main.js
            sed -i "s|_CUSTOMER_API_URL_|http://$CUSTOMER_IP:8002|g" frontend/main.js
            
            # Display the modified file content for debugging
            echo "--- Modified main.js content ---"
            cat frontend/main.js
            echo "---------------------------------"
      
        # Build and Push Docker image for Frontend
        - name: Build and Push Frontend Image
          run: |
            set -euo pipefail
            docker build -t "${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest" ./frontend/
            docker push "${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest"

        - name: Deploy Frontend to AKS
          run: |
            set -euo pipefail

            echo "Deploying frontend to AKS cluster.."
            
            cd k8s/
            # Ensure frontend-service.yaml is configured with your ACR
            kubectl apply -n "$NS" -f frontend.yaml

        - name: Wait for Frontend LoadBalancer IPs
          env:
            FRONTEND_SERVICE_NAME: "frontend-w10-aks"
          run: |
            set -euo pipefail
            
            echo "Waiting for Frontend LoadBalancer IPs to be assigned (up to 5 minutes)..."
            FRONTEND_IP=""
            
            
            for i in $(seq 1 60); do
              echo "Attempt $i/60 to get IP..."
              FRONTEND_IP=$(kubectl get service "$FRONTEND_SERVICE_NAME" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

              if [[ -n "$FRONTEND_IP" ]]; then
                echo "Frontend LoadBalancer IPs assigned: $FRONTEND_IP"
                break
              fi
              sleep 5 # Wait 5 seconds before next attempt
            done
            
            if [[ -z "$FRONTEND_IP" ]]; then
              echo "Error: One or more LoadBalancer IPs not assigned after timeout."
              exit 1 # Fail the job if IP is not obtained
            fi
            
            # These are environment variables for subsequent steps in the *same job*
            # And used to set the job outputs
            echo "FRONTEND_IP=$FRONTEND_IP" >> $GITHUB_ENV

            echo " Production ENVIRONMENT DEPLOYED SUCCESSFULLY!"

        - name: Logout from Azure
          run: az logout